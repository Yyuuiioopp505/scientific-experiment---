<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>تجربة اتخاذ القرار بالأشكال</title><style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#667085;--primary:#2563eb;--line:#dbe2ea}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eef4ff,#fafcff);color:var(--text);font-family:Tahoma,Arial,sans-serif;line-height:1.8}.container{max-width:920px;margin:auto;padding:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px;margin:14px 0;box-shadow:0 12px 30px #17203310}.hero{text-align:center;padding:34px 22px}.badge{display:inline-block;background:#e8efff;color:#1d4ed8;border-radius:99px;padding:4px 12px;font-weight:700;font-size:13px}.muted,small{color:var(--muted)}h1{font-size:clamp(26px,6vw,40px)}h2{font-size:22px}.notice{background:#f8fafc;border-right:4px solid var(--primary);padding:12px 15px;border-radius:10px;margin:15px 0}.consent label{display:block;padding:10px}.btn,.opt{border:0;border-radius:13px;padding:13px 18px;font-weight:700;min-height:48px}.btn{background:var(--primary);color:white}.btn.secondary{background:#e8edf5;color:var(--text)}label{display:block;font-weight:700;margin:14px 0}input{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin-top:6px}.top{display:flex;gap:12px;align-items:center}.progress{height:9px;background:#e8edf4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--primary)}.timer{font-weight:900;background:#ecfdf3;color:#166534;padding:7px 13px;border-radius:12px;min-width:75px;text-align:center}.timer.warn{background:#fff7ed;color:#c2410c}.timer.bad{background:#fef2f2;color:#b91c1c}.visual{min-height:250px;border:1px dashed #cbd5e1;border-radius:16px;background:#fbfdff;display:flex;align-items:center;justify-content:center;padding:18px;margin:18px 0}.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.opt{border:2px solid var(--line);background:white}.opt:hover{border-color:#93c5fd;background:#eff6ff}.shapes{display:flex;gap:18px;justify-content:center;align-items:center;flex-wrap:wrap}.box{width:76px;height:76px;border:1px solid #e1e7ef;border-radius:12px;display:flex;align-items:center;justify-content:center;position:relative;background:#fff;font-size:35px}.shape{display:inline-block;width:48px;height:48px;border:4px solid #172033}.shape.circle{border-radius:50%}.shape.square{border-radius:6px}.star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 95%,50% 72%,21% 95%,32% 57%,2% 35%,39% 35%);border:0;background:#172033}.tri{display:inline-block;width:0;height:0;border-left:27px solid transparent;border-right:27px solid transparent;border-bottom:50px solid #172033}.arrow{font-size:54px;font-weight:900}.poly{font-size:46px}.row{display:flex;gap:15px;align-items:center;justify-content:center;margin:10px}.matrix{display:grid;grid-template-columns:repeat(3,78px);gap:10px}.matrix>div{width:78px;height:78px;border:1px solid #dbe2ea;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:35px;background:#fff}.analogy{font-size:35px;display:flex;gap:18px;align-items:center;justify-content:center}.pair{display:flex;gap:18px;align-items:center;justify-content:center;margin:8px}.pos{display:block;width:25px;height:25px;background:#172033;border-radius:50%}.dots{display:flex;gap:4px;flex-wrap:wrap;max-width:50px;justify-content:center}.dot{width:7px;height:7px;border-radius:50%;background:#172033;display:inline-block}.big{font-size:70px}.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kpis>div{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center}.kpis b{display:block;font-size:26px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;vertical-align:top}th{background:#f8fafc}@media(max-width:600px){.card{padding:17px}.opts{grid-template-columns:1fr}.visual{min-height:210px}.matrix{grid-template-columns:repeat(3,65px)}.matrix>div{width:65px;height:65px}.kpis{grid-template-columns:1fr 1fr}.kpis>div:last-child{grid-column:1/-1}}@media print{body{background:#fff}.no-print{display:none}.card{box-shadow:none}}
</style></head><body><main id="app" class="container"></main><script>
const QUESTIONS=[{"id":1,"level":"سهل","type":2,"prompt":"أي شكل مختلف عن بقية الأشكال؟","visual":"grid_diff","data":{"items":["circle","circle","square","circle"],"diff":2},"options":["الشكل 1","الشكل 3"],"answer":1},{"id":2,"level":"سهل","type":2,"prompt":"ما الشكل التالي في النمط؟","visual":"sequence","data":{"seq":["triangle","circle","triangle","circle","?"]},"options":["مثلث","مربع"],"answer":0},{"id":3,"level":"سهل","type":2,"prompt":"أي سهم يشير إلى الاتجاه المختلف؟","visual":"arrows","data":{"items":["up","up","down","up"]},"options":["السهم 1 و2","السهم 3"],"answer":1},{"id":4,"level":"سهل","type":2,"prompt":"أي خيار يكمل الزوج المتكرر؟","visual":"sequence","data":{"seq":["circle","square","circle","?"]},"options":["مربع","دائرة"],"answer":0},{"id":5,"level":"سهل","type":3,"prompt":"ما الشكل الذي يأتي بعد ذلك؟","visual":"sequence","data":{"seq":["square","circle","triangle","square","circle","?"]},"options":["مثلث","مربع","دائرة"],"answer":0},{"id":6,"level":"سهل","type":3,"prompt":"أوجد الشكل الخاطئ في الصف.","visual":"grid_diff","data":{"items":["triangle","triangle","circle","triangle","triangle","triangle"],"diff":2},"options":["الشكل 1","الشكل 2","الشكل 3"],"answer":2},{"id":7,"level":"سهل","type":3,"prompt":"ما الاتجاه التالي للسهم؟","visual":"arrow_sequence","data":{"seq":["right","down","left","?"]},"options":["أعلى","يمين","يسار"],"answer":0},{"id":8,"level":"سهل","type":3,"prompt":"أي شكل يكمل التسلسل؟","visual":"size_sequence","data":{"seq":["small","medium","large","?"]},"options":["دائرة صغيرة","دائرة متوسطة","دائرة كبيرة"],"answer":0},{"id":9,"level":"سهل","type":4,"prompt":"ما الشكل التالي؟","visual":"sequence","data":{"seq":["circle","square","triangle","star","circle","?"]},"options":["مربع","مثلث","نجمة","دائرة"],"answer":0},{"id":10,"level":"سهل","type":4,"prompt":"أوجد الشكل المختلف.","visual":"grid_diff","data":{"items":["square","square","square","circle","square","square","square","square"],"diff":3},"options":["الشكل 1","الشكل 2","الشكل 3","الشكل 4"],"answer":3},{"id":11,"level":"سهل","type":4,"prompt":"أي اتجاه يكمل الدوران؟","visual":"arrow_sequence","data":{"seq":["up","right","down","?"]},"options":["أعلى","يمين","يسار","أسفل"],"answer":0},{"id":12,"level":"سهل","type":4,"prompt":"اختر الشكل الذي يطابق القاعدة: ضلع واحد أكثر في كل خطوة.","visual":"sides_sequence","data":{"sides":[3,4,5,"?"]},"options":["3 أضلاع","4 أضلاع","5 أضلاع","6 أضلاع"],"answer":3},{"id":13,"level":"متوسط","type":2,"prompt":"ما الشكل التالي في هذا النمط؟","visual":"sequence","data":{"seq":["circle","square","circle","square","?"]},"options":["دائرة","مربع"],"answer":0},{"id":14,"level":"متوسط","type":2,"prompt":"ما الشكل التالي إذا كان كل شكل يدور 90 درجة؟","visual":"rotate_sequence","data":{"angles":[0,90,180,270,"?"]},"options":["0°","90°"],"answer":0},{"id":15,"level":"متوسط","type":2,"prompt":"أي صف يكسر نمط التناوب؟","visual":"pattern_rows","data":{"rows":[["circle","square","circle"],["square","circle","square"],["circle","square","circle"],["square","circle","circle"]]},"options":["الصف 3","الصف 4"],"answer":1},{"id":16,"level":"متوسط","type":2,"prompt":"أكمل الشكل المتناظر حول محور رأسي.","visual":"symmetry","data":{"left":"triangle"},"options":["مثلث معكوس","مربع"],"answer":0},{"id":17,"level":"متوسط","type":3,"prompt":"ما الشكل المفقود في المصفوفة؟","visual":"matrix","data":{"cells":["circle","square","triangle","square","triangle","circle","triangle","circle","?"]},"options":["مربع","دائرة","مثلث"],"answer":0},{"id":18,"level":"متوسط","type":3,"prompt":"ما الموضع التالي؟ تتحرك النقطة خطوة واحدة باتجاه عقارب الساعة.","visual":"position_sequence","data":{"seq":["top","right","bottom","?"]},"options":["يسار","أعلى","يمين"],"answer":0},{"id":19,"level":"متوسط","type":3,"prompt":"ما الشكل التالي؟ يدور المثلث 90° في كل خطوة.","visual":"sequence","data":{"seq":["triangle_up","triangle_right","triangle_down","?"]},"options":["مثلث يسار","مثلث أعلى","مثلث يمين"],"answer":0},{"id":20,"level":"متوسط","type":3,"prompt":"أي خيار يعبّر عن عدد النقاط الصحيح في الخطوة التالية؟","visual":"dots_sequence","data":{"counts":[1,2,3,"?"]},"options":["4 نقاط","5 نقاط","6 نقاط"],"answer":0},{"id":21,"level":"متوسط","type":4,"prompt":"ما الشكل التالي؟ تتناوب الهيئة ويزداد عدد النقاط نقطة واحدة.","visual":"shape_dots","data":{"seq":[["circle",1],["square",2],["circle",3],["square",4],["circle",5],["?","?"]]},"options":["مربع + 6 نقاط","دائرة + 6 نقاط","مربع + 5 نقاط","دائرة + 4 نقاط"],"answer":0},{"id":22,"level":"متوسط","type":4,"prompt":"أي سهم من الأسهم الأربعة يشير إلى الأسفل؟","visual":"arrows","data":{"items":["up","left","down","right"]},"options":["السهم 1","السهم 2","السهم 3","السهم 4"],"answer":2},{"id":23,"level":"متوسط","type":4,"prompt":"أي عدد أضلاع يكمل التسلسل؟","visual":"polygon_sequence","data":{"sides":[3,4,5,6,"?"]},"options":["3","4","5","7"],"answer":3},{"id":24,"level":"متوسط","type":4,"prompt":"ما الشكل الذي يجب أن يكون في مكان علامة الاستفهام؟","visual":"matrix","data":{"cells":["circle","triangle","square","triangle","square","circle","square","circle","?"]},"options":["دائرة","مثلث","مربع","نجمة"],"answer":1},{"id":25,"level":"صعب","type":2,"prompt":"ما القاعدة التي تكمل التسلسل؟ الشكل يدور 90° في كل خطوة.","visual":"hard_rotate","data":{"angles":[0,90,180,"?"]},"options":["270°","90°"],"answer":0},{"id":26,"level":"صعب","type":2,"prompt":"أي خيار يحافظ على العلاقة بين الشكلين؟","visual":"analogy","data":{"a":"triangle_up","b":"triangle_down","c":"square_left"},"options":["مربع يمين","مربع أعلى"],"answer":0},{"id":27,"level":"صعب","type":2,"prompt":"أوجد النمط المختلف: كل زوج متجاور يجب أن يختلف في الشكل والاتجاه.","visual":"hard_pairs","data":{"pairs":[["circle_up","square_right"],["triangle_down","circle_left"],["square_up","triangle_right"],["circle_down","circle_left"]]},"options":["الزوج 1","الزوج 4"],"answer":1},{"id":28,"level":"صعب","type":2,"prompt":"يزداد عدد النقاط بمقدار نقطتين كل مرة. كم نقطة تأتي بعد 2، 4، 6؟","visual":"dots_sequence","data":{"counts":[2,4,6,"?"]},"options":["8 نقاط","10 نقاط"],"answer":0},{"id":29,"level":"صعب","type":3,"prompt":"ما الخلية المفقودة؟ كل صف وعمود يحتوي دائرة ومثلث ومربع مرة واحدة.","visual":"latin","data":{"rows":[["circle","triangle","square"],["triangle","square","circle"],["square","circle","?"]]},"options":["دائرة","مثلث","مربع"],"answer":1},{"id":30,"level":"صعب","type":3,"prompt":"يتكرر النمط: مثلث، مربع، مثلث، مربع. ما الشكل التالي؟","visual":"sequence","data":{"seq":["triangle","square","triangle","square","?"]},"options":["مثلث","مربع","دائرة"],"answer":0},{"id":31,"level":"صعب","type":3,"prompt":"أي صف يكسر قاعدة: في كل صف تدور الأسهم 90° بالاتجاه نفسه؟","visual":"arrow_matrix","data":{"rows":[["up","right","down"],["right","down","left"],["down","right","up"]]},"options":["الصف 1","الصف 2","الصف 3"],"answer":2},{"id":32,"level":"صعب","type":3,"prompt":"يتكرر نمط عدد النقاط: 1، 3، 2، 4، 3. كم نقطة تأتي بعد ذلك؟","visual":"dots_sequence","data":{"counts":[1,3,2,4,3,"?"]},"options":["4 نقاط","5 نقاط","6 نقاط"],"answer":1},{"id":33,"level":"صعب","type":4,"prompt":"انظر إلى كل زوج. أي زوج يحتوي على شكلين من النوع نفسه؟","visual":"hard_pairs","data":{"pairs":[["circle_up","square_right"],["triangle_down","circle_left"],["square_up","triangle_right"],["circle_down","circle_left"]]},"options":["الزوج 1","الزوج 2","الزوج 3","الزوج 4"],"answer":3},{"id":34,"level":"صعب","type":4,"prompt":"يتناوب حجم الدائرة: صغيرة، متوسطة، كبيرة، ثم يبدأ النمط من جديد. ما الحجم التالي؟","visual":"size_sequence","data":{"seq":["small","medium","large","?"]},"options":["دائرة صغيرة","دائرة متوسطة","دائرة كبيرة","مربع صغير"],"answer":0},{"id":35,"level":"صعب","type":4,"prompt":"يزداد عدد النقاط نقطة واحدة في كل مرة: 2، 3، 4. كم نقطة تأتي بعد ذلك؟","visual":"dots_sequence","data":{"counts":[2,3,4,"?"]},"options":["4 نقاط","5 نقاط","6 نقاط","7 نقاط"],"answer":1},{"id":36,"level":"صعب","type":4,"prompt":"أي سهم من الأسهم الأربعة يشير إلى اليسار؟","visual":"arrows","data":{"items":["up","left","down","right"]},"options":["السهم 1","السهم 2","السهم 3","السهم 4"],"answer":1}];
const intro=`عزيزي المشارك، لدينا تجربة علمية تهدف إلى دراسة أثر تدرج مستوى صعوبة المهام على سرعة ودقة اتخاذ القرار. سيطلب منك الإجابة عن مجموعة من الأسئلة التي تعتمد على الأشكال والأنماط البصرية، وتزداد درجة صعوبتها تدريجيا من المستوى السهل إلى المتوسط ثم الصعب.`;
const instructions=["اقرأ كل سؤال بعناية.","اختر الإجابة التي تراها صحيحة.","المدة الزمنية للإجابة على كل سؤال 18 ثانية، بمعدل 11 دقيقة تقريبا لجميع الأسئلة.","أجب بالترتيب دون الاستعانة بمصادر خارجية.","حاول تحقيق الدقة مع عدم إطالة التفكير.","إذا لم تكن متأكدا من الإجابة، اختر الإجابة الأقرب في رأيك."];
let S={page:"intro",participant:{name:"",age:"",major:""},answers:[],times:[],i:0,startedAt:0,qStarted:0,left:18,timer:null};
const A=(s)=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
function render(){let x=document.getElementById("app");x.innerHTML=S.page==="intro"?introPage():S.page==="data"?dataPage():S.page==="quiz"?quizPage():resultsPage();}
function introPage(){return `<section class="card hero"><span class="badge">تجربة بحثية • 36 سؤالًا</span><h1>تجربة اتخاذ القرار بالأشكال والأنماط</h1><p>${intro}</p></section><section class="card"><h2>تعليمات التجربة</h2><ol>${instructions.map(x=>`<li>${x}</li>`).join("")}</ol><div class="notice">لا تؤثر إجابتك على أي تقييم دراسي أو أكاديمي، والمشاركة لأغراض البحث فقط.</div><p>إذا شعرت بعدم الرغبة في الاستمرار، يمكنك الانسحاب من التجربة في أي وقت.</p></section><section class="card"><h2>نموذج الموافقة للمشاركة في تجربة بحثية</h2><p>أوافق على المشاركة في تجربة علمية بعنوان:</p><p><b>«أثر تدرج مستوى صعوبة المهام على سرعة ودقة اتخاذ القرار لدى الطلاب في جامعة الملك سعود»</b></p><p>وقد تم توضيح أن المشاركة تتضمن الإجابة عن مجموعة من الأسئلة البصرية المتدرجة في مستوى الصعوبة وأن البيانات ستستخدم لأغراض البحث العلمي فقط.</p><p>أعلم أن مشاركتي طوعية، ويحق لي الانسحاب من التجربة في أي وقت دون أي تبعات. سيتم التعامل مع البيانات التي يتم جمعها بسرية، وستستخدم لأغراض البحث العلمي فقط.</p><div class="consent"><label><input type="radio" name="c" value="y"> أوافق على المشاركة في التجربة</label><label><input type="radio" name="c" value="n"> لا أوافق على المشاركة في التجربة</label></div><button class="btn" onclick="consent()">متابعة</button></section>`}
function consent(){let v=document.querySelector('input[name=c]:checked');if(!v)return alert("يرجى اختيار أحد الخيارين.");if(v.value==="n")return alert("شكرًا لك. تم تسجيل عدم الموافقة ويمكنك إغلاق الصفحة.");S.page="data";render();}
function dataPage(){return `<section class="card"><span class="badge">بيانات المشارك</span><h2>قبل بدء الاختبار</h2><label>الاسم<input id="name" value="${A(S.participant.name)}" placeholder="الاسم"></label><label>العمر<input id="age" type="number" value="${A(S.participant.age)}" placeholder="العمر"></label><label>التخصص<input id="major" value="${A(S.participant.major)}" placeholder="التخصص"></label><div class="notice">36 سؤالًا • 18 ثانية لكل سؤال • الانتقال تلقائيًا عند انتهاء الوقت.</div><button class="btn" onclick="start()">بدء التجربة</button></section>`}
function start(){let name=nameEl().value.trim(),age=ageEl().value.trim(),major=majorEl().value.trim();if(!name||!age||!major)return alert("يرجى تعبئة الاسم والعمر والتخصص.");S.participant={name,age,major};S.i=0;S.answers=[];S.times=[];S.startedAt=Date.now();S.page="quiz";begin();render()}
const nameEl=()=>document.getElementById("name"),ageEl=()=>document.getElementById("age"),majorEl=()=>document.getElementById("major");
function begin(){clearInterval(S.timer);S.left=18;S.qStarted=Date.now();S.timer=setInterval(()=>{S.left--;tick();if(S.left<=0){clearInterval(S.timer);answer(null)}},1000)}
function tick(){let e=document.getElementById("timer");if(e){e.textContent=S.left+" ث";e.className="timer "+(S.left<=5?"bad":S.left<=8?"warn":"")}}
function quizPage(){let q=QUESTIONS[S.i],pct=Math.round(S.i/36*100);return `<div class="top"><div style="flex:1"><div class="small">السؤال ${S.i+1} من 36 • المستوى <b>${q.level}</b></div><div class="progress"><i style="width:${pct}%"></i></div></div><div id="timer" class="timer">${S.left} ث</div></div><section class="card"><h2>${q.prompt}</h2><div class="visual">${vis(q)}</div><div class="opts">${q.options.map((o,i)=>`<button class="opt" onclick="answer(${i})">${A(o)}</button>`).join("")}</div></section>`}
function sh(k){let r=k.includes("right")?90:k.includes("down")?180:k.includes("left")?270:0;if(k.includes("triangle"))return `<span class="tri" style="transform:rotate(${r}deg)"></span>`;let c=k.includes("circle")?"circle":k.includes("square")?"square":k.includes("star")?"star":"square";return `<span class="shape ${c}" style="transform:rotate(${r}deg)"></span>`}
function ar(k){return `<span class="arrow">${({up:"↑",right:"→",down:"↓",left:"←"})[k]||"?"}</span>`}
function dots(n){return n==="?"?"?":Array.from({length:Math.min(Number(n),9)},()=>'<i class="dot"></i>').join("")}
function vis(q){let d=q.data;
if(q.visual==="grid_diff")return `<div class="shapes">${d.items.map((x,i)=>`<div><div class="box">${sh(x)}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="sequence")return `<div class="shapes">${d.seq.map((x,i)=>`<div><div class="box">${x==="?"?"?":sh(x)}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="arrows"||q.visual==="arrow_sequence"){let z=d.items||d.seq;return `<div class="shapes">${z.map((x,i)=>`<div><div class="box">${x==="?"?"?":ar(x)}</div><small>${i+1}</small></div>`).join("")}</div>`}
if(q.visual==="size_sequence")return `<div class="shapes">${d.seq.map((x,i)=>`<div><div class="box"><span class="shape circle" style="width:${x==="small"?28:x==="medium"?44:60}px;height:${x==="small"?28:x==="medium"?44:60}px"></span></div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="sides_sequence"||q.visual==="polygon_sequence")return `<div class="shapes">${d.sides.map((x,i)=>`<div><div class="box poly">${x==="?"?"?":["","△","□","⬠","⬡","⬢","⬣","⬟"][x]||x}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="rotate_sequence")return `<div class="shapes">${d.angles.map((x,i)=>`<div><div class="box">${x==="?"?"?":`<span class="tri" style="transform:rotate(${x}deg)"></span>`}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="pattern_rows")return `<div>${d.rows.map((r,i)=>`<div class="row">${r.map(x=>sh(x)).join("")}<small>صف ${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="symmetry")return `<div class="analogy">${sh(d.left)} <b>↔</b> ?</div>`;
if(q.visual==="matrix"||q.visual==="latin")return `<div class="matrix">${(d.cells||d.rows.flat()).map(x=>`<div>${x==="?"?"?":sh(x)}</div>`).join("")}</div>`;
if(q.visual==="position_sequence")return `<div class="shapes">${d.seq.map((x,i)=>`<div><div class="box">${x==="?"?"?":`<span class="pos" style="transform:translate(${x==="right"?25:x==="left"?-25:0}px,${x==="top"?-25:x==="bottom"?25:0}px)"></span>`}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="dots_sequence")return `<div class="shapes">${d.counts.map((n,i)=>`<div><div class="box dots">${dots(n)}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="shape_dots")return `<div class="shapes">${d.seq.map((x,i)=>`<div><div class="box">${x[0]==="?"?"?":sh(x[0])}<span class="dots">${dots(x[1])}</span></div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="hard_rotate")return `<div class="shapes">${d.angles.map((x,i)=>`<div><div class="box">${x==="?"?"?":`<span class="shape square" style="background:${i%2?"#fff":"#172033"};transform:rotate(${x}deg)"></span>`}</div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="analogy")return `<div class="analogy">${sh(d.a)} → ${sh(d.b)} &nbsp; :: &nbsp; ${sh(d.c)} → ?</div>`;
if(q.visual==="hard_pairs")return `<div>${d.pairs.map((p,i)=>`<div class="pair">${sh(p[0])} + ${sh(p[1])}<small>زوج ${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="dot_move")return `<div class="big">← • →</div>`;
if(q.visual==="hard_sequence")return `<div class="shapes">${d.items.map((x,i)=>`<div><div class="box">${x[0]==="?"?"?":sh(x[0])}<span class="dots">${dots(x[1])}</span></div><small>${x[2]}</small></div>`).join("")}</div>`;
if(q.visual==="arrow_matrix")return `<div class="matrix">${d.rows.flat().map(x=>`<div>${ar(x)}</div>`).join("")}</div>`;
if(q.visual==="triple_sequence"||q.visual==="compound")return `<div class="shapes">${d.items.map((x,i)=>`<div><div class="box">${x[0]==="?"?"?":sh(x[0]+"_"+x[1])}<span class="dots">${dots(x[2])}</span></div><small>${i+1}</small></div>`).join("")}</div>`;
if(q.visual==="hard_matrix")return `<div class="matrix">${d.cells.map(x=>`<div>${x==="?"?"?":sh(x)}</div>`).join("")}</div>`;
if(q.visual==="transform")return `<div class="analogy">${ar("up")} → ↺ → ?</div>`;
return "?";}
function answer(a){clearInterval(S.timer);S.answers[S.i]=a;S.times[S.i]=Math.min(18,Math.round((Date.now()-S.qStarted)/10)/100);setTimeout(()=>{if(S.i<35){S.i++;begin();render()}else{S.page="results";render()}},100)}
function resultsPage(){let score=S.answers.reduce((s,a,i)=>s+(a===QUESTIONS[i].answer?1:0),0),avg=S.times.reduce((a,b)=>a+b,0)/36;return `<section class="card"><span class="badge">انتهت التجربة</span><h1>نتائج المشارك</h1><div class="kpis"><div><b>${score}/36</b><span>الدرجة</span></div><div><b>${Math.round(score/36*100)}%</b><span>الدقة</span></div><div><b>${avg.toFixed(2)} ث</b><span>متوسط الزمن</span></div></div></section><section class="card"><h2>بيانات المشارك</h2><p><b>الاسم:</b> ${A(S.participant.name)}</p><p><b>العمر:</b> ${A(S.participant.age)}</p><p><b>التخصص:</b> ${A(S.participant.major)}</p></section><section class="card"><h2>تفاصيل الأسئلة</h2><div class="tablewrap"><table><thead><tr><th>#</th><th>المستوى</th><th>السؤال</th><th>إجابة المشارك</th><th>الصحيحة</th><th>الزمن</th><th>النتيجة</th></tr></thead><tbody>${QUESTIONS.map((q,i)=>`<tr><td>${i+1}</td><td>${q.level}</td><td>${A(q.prompt)}</td><td>${S.answers[i]==null?"لم يجب":A(q.options[S.answers[i]])}</td><td>${A(q.options[q.answer])}</td><td>${S.times[i]??18} ث</td><td>${S.answers[i]===q.answer?"صحيح":"خطأ"}</td></tr>`).join("")}</tbody></table></div></section><section class="card no-print"><h2>حفظ ومقارنة</h2><p>يمكنك حفظ النتائج كملف JSON للمقارنة بين الاستجابات، أو طباعتها كـ PDF.</p><button class="btn" onclick="saveJSON()">حفظ JSON</button> <button class="btn secondary" onclick="print()">طباعة / PDF</button> <button class="btn secondary" onclick="localSave()">حفظ داخل الجهاز</button></section>`}
function saveJSON(){let score=S.answers.reduce((s,a,i)=>s+(a===QUESTIONS[i].answer?1:0),0);let out={participant:S.participant,startedAt:new Date(S.startedAt).toISOString(),score,questions:QUESTIONS.map((q,i)=>({number:i+1,level:q.level,question:q.prompt,answer:S.answers[i]==null?null:q.options[S.answers[i]],correctAnswer:q.options[q.answer],correct:S.answers[i]===q.answer,timeSeconds:S.times[i]??18}))};let b=new Blob([JSON.stringify(out,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="shape-experiment-results.json";a.click();URL.revokeObjectURL(a.href)}
function localSave(){let key="shapeExperimentResults";let x=JSON.parse(localStorage.getItem(key)||"[]");x.push({participant:S.participant,startedAt:new Date(S.startedAt).toISOString(),answers:S.answers,times:S.times});localStorage.setItem(key,JSON.stringify(x));alert("تم حفظ نسخة داخل هذا الجهاز.");}
render();
</script></body></html>
